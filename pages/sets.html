<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0c0c">
  <title>zarbig - dj sets</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
</head>
<body>
  <header class="app-header sets-header">
    <a href="../index.html" class="back-btn"><i class="ph ph-arrow-left"></i> back to hub</a>
    <h1><i class="ph ph-sliders"></i> dj sets</h1>
    <p>cloud storage and distribution</p>
  </header>

  <!-- Card de Listagem (Topo) -->
  <div class="card">
    <div class="list-header">
      <h3 class="section-title" style="margin: 0;">available sets</h3>
      <button id="btnDeleteAll" class="btn-danger-outline" style="display: none;"><i class="ph ph-trash"></i> delete all</button>
    </div>

    <ul id="listaSets" class="sets-list">
      <!-- Injetado via JS -->
    </ul>
  </div>

  <!-- Botão / Toggle Admin Mode -->
  <div style="margin-bottom: 12px; text-align: center;">
    <button id="btnAdminToggle" class="btn-sec" onclick="toggleAdminMode()"><i class="ph ph-lock"></i> admin mode</button>
  </div>

  <!-- Card de Upload (Oculto por padrão, visível apenas com admin autenticado) -->
  <div id="uploadCard" class="card" style="display: none;">
    <div class="list-header">
      <h3 class="section-title" style="margin: 0;">new set upload</h3>
    </div>
    
    <!-- Input de Nome Customizado -->
    <div class="input-group">
      <label for="setNameInput">set name (optional)</label>
      <input type="text" id="setNameInput" class="text-input" placeholder="ex: warmup hard techno @ 101hz">
    </div>

    <!-- Dropzone Customizada para o Arquivo -->
    <label for="fileInput" class="file-dropzone" id="dropzoneLabel">
      <i class="ph ph-folder-open drop-icon"></i>
      <span id="fileNameDisplay" class="drop-title">click to select audio file</span>
      <span class="drop-hint">mp3, wav, flac, m4a, aac, ogg</span>
      <input type="file" id="fileInput" accept="audio/mpeg, audio/mp3, audio/wav, audio/x-wav, audio/flac, audio/x-flac, audio/aac, audio/mp4, audio/x-m4a, audio/ogg, audio/webm, audio/aiff, audio/x-aiff">
    </label>

    <button id="btnUpload" class="btn-primary"><i class="ph ph-rocket"></i> upload set</button>
    <div id="status" class="status-msg"></div>
  </div>

  <!-- Player de Áudio Integrado Fixo -->
  <div id="audioPlayerCard" class="audio-player-card">
    <div class="player-info">
      <span id="playerTitle" class="player-title">no track playing</span>
      <button class="player-close" onclick="closeAudioPlayer()"><i class="ph ph-x"></i></button>
    </div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    function closeAudioPlayer() {
      const playerCard = document.getElementById('audioPlayerCard');
      const audio = document.getElementById('audioPlayer');
      audio.pause();
      audio.src = '';
      playerCard.style.display = 'none';
    }
  </script>
  <script type="module" src="../assets/js/sets.js"></script>
</body>
</html>
