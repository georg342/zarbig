<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Zarbig - DJ Sets</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="app-header sets-header">
    <a href="../index.html" class="back-btn">⬅ Voltar ao Hub</a>
    <h1>🎛️ DJ Sets</h1>
    <p>Armazenamento e distribuição na nuvem</p>
  </header>

  <!-- Card de Upload -->
  <div class="card">
    <h3 class="section-title">Novo Set</h3>
    
    <!-- Input de Nome Customizado -->
    <div class="input-group">
      <label for="setNameInput">Nome do Set (opcional)</label>
      <input type="text" id="setNameInput" class="text-input" placeholder="Ex: Warmup Hard Techno @ 101Hz">
    </div>

    <!-- Dropzone Customizada para o Arquivo -->
    <label for="fileInput" class="file-dropzone" id="dropzoneLabel">
      <span class="drop-icon">📂</span>
      <span id="fileNameDisplay" class="drop-title">Clique para selecionar o arquivo de áudio</span>
      <span class="drop-hint">MP3, WAV, FLAC, M4A, AAC ou OGG</span>
      <input type="file" id="fileInput" accept="audio/mpeg, audio/mp3, audio/wav, audio/x-wav, audio/flac, audio/x-flac, audio/aac, audio/mp4, audio/x-m4a, audio/ogg, audio/webm, audio/aiff, audio/x-aiff">
    </label>

    <button id="btnUpload" class="btn-primary">🚀 Fazer Upload</button>
    <div id="status" class="status-msg"></div>
  </div>

  <!-- Card de Listagem -->
  <div class="card">
    <div class="list-header">
      <h3 class="section-title" style="margin: 0;">Sets Disponíveis</h3>
      <button id="btnDeleteAll" class="btn-danger-outline" style="display: none;">🗑️ Apagar Todos</button>
    </div>

    <ul id="listaSets" class="sets-list">
      <!-- Injetado via JS -->
    </ul>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="../assets/js/sets.js"></script>
</body>
</html>
